---
jenkins:
  systemMessage: "Managed by Jenkins Configuration as Code. Changes made in the UI are overwritten on restart."
  numExecutors: 0          # builds run on agents, never on the controller
  mode: EXCLUSIVE
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"   # read from /run/secrets, never stored in git
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Read"
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: true

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  globalLibraries:
    libraries:
      - name: "pipeline-lib"
        defaultVersion: "master"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/shivanjalikaname/jenkins2.git"

jobs:
  - script: |
      folder('platform') {
        description('Jobs generated by Job DSL from casc/jenkins.yaml')
      }
      pipelineJob('platform/sample-service') {
        description('Example service built with the shared standardPipeline step')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/shivanjalikaname/jenkins2.git') }
                branch('*/master')
              }
            }
            scriptPath('examples/Jenkinsfile')
            lightweight(true)
          }
        }
      }
